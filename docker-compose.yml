version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: filecloud_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filecloud}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - filecloud_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-filecloud}" ]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    container_name: filecloud_backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-filecloud}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      SECRET_KEY: ${SECRET_KEY:-super_secret_dev_key}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-filecloud-bucket}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT_EXTERNAL:-8000}:8000"
    networks:
      - filecloud_network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: filecloud_frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT_EXTERNAL:-3000}:80"
    networks:
      - filecloud_network

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT_API:-9000}:9000"
      - "${MINIO_PORT_CONSOLE:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - filecloud_network

volumes:
  postgres_data:
  minio-data:

networks:
  filecloud_network:
    driver: bridge