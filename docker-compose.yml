version: '3.8'

services:
  # ===== PostgreSQL =====
  db:
    image: postgres:15
    container_name: filecloud_database
    environment:
      POSTGRES_DB: filecloud
      POSTGRES_USER: filecloud_user
      POSTGRES_PASSWORD: filecloud_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network 

  redis:
    image: redis:7-alpine
    container_name: filecloud_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network  

  minio:
    image: minio/minio:latest
    container_name: filecloud_s3
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:

networks: 
  app-network:
    driver: bridge
