name: CI/CD

on:
  push:
    branches: [ main, future ]
  pull_request:
    branches: [ main, future ]

jobs:
  # ===== Lint & Format =====
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: uv sync --frozen
      
      - name: Run Black (check only)
        run: uv run black --check .
      
      - name: Run Flake8
        run: |
          uv pip install flake8
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ===== Tests =====
  test:
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: filecloud_test
          POSTGRES_USER: filecloud_user
          POSTGRES_PASSWORD: filecloud_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin_password
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 30s
          --health-timeout 20s
          --health-retries 3
        volumes:
          - minio_data:/data
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: uv sync --frozen
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=filecloud_test
          DB_USER=filecloud_user
          DB_PASSWORD=filecloud_password
          SECRET_KEY=test_secret_key_for_ci
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          MINIO_ENDPOINT=localhost
          MINIO_PORT_API=9000
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin_password
          MINIO_BUCKET_NAME=uploads
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_DB=0
          MAX_FILE_SIZE=104857600
          MAX_TOTAL_SIZE=524288000
          EOF
      
      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: filecloud_test
          DB_USER: filecloud_user
          DB_PASSWORD: filecloud_password
      
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: filecloud_test
          DB_USER: filecloud_user
          DB_PASSWORD: filecloud_password
          SECRET_KEY: test_secret_key_for_ci
          MINIO_ENDPOINT: localhost
          MINIO_PORT_API: 9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ===== Docker Build =====
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: filecloud-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
