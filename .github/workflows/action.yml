name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install linting tools
        run: pip install flake8 black

      - name: Run Black (Check formatting)
        run: black --check . --exclude alembic

      - name: Run Flake8 (Check logic/style)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose Alias
        run: sudo ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose

      - name: Prepare Files
        run: touch init-db.sql

      - name: Build and Start Infrastructure
        run: |
          make build
          make up
          sleep 30

      - name: Debug DB if failed
        if: failure()
        run: docker logs filecloud_db

      - name: Run Migrations
        run: make migrate

      - name: Run Tests
        run: make test

      - name: Cleanup
        if: always()
        run: make clean
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cloudflare Client
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ssh.stadolnik.site >> ~/.ssh/known_hosts || true

      - name: Deploy via SSH + Cloudflare Tunnel
        env:
          SSH_HOST: ssh.stadolnik.site
          SSH_USER: duck
        run: |
            ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="/usr/local/bin/cloudflared access ssh --hostname %h" \
            $SSH_USER@$SSH_HOST << 'EOF'
              cd /home/duck/Dev/Python/graduation
              git pull origin main
              make build
              make up
              make migrate
              docker image prune -f
            EOF